name: huit_conference_app
description: |
  Hệ thống quản lý hội thảo khoa học HUIT
  Mobile app với giao diện đẹp mắt, màu pastel chuyên nghiệp
  Hỗ trợ 3 vai trò: Tác giả, Phản biện, Quản trị viên

# Thông tin phát hành
publish_to: 'none' # Không publish lên pub.dev

# Version: major.minor.patch+build
version: 1.0.0+1

# Môi trường SDK
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

# ============================================
# DEPENDENCIES - Các thư viện chính
# ============================================
dependencies:
  flutter:
    sdk: flutter
  
  # Icons
  cupertino_icons: ^1.0.6
  
  # UI/UX Enhancement
  google_fonts: ^6.1.0              # Font đẹp từ Google
  flutter_svg: ^2.0.9               # Hỗ trợ SVG icons
  animations: ^2.0.11               # Smooth animations
  
  # State Management (tuỳ chọn)
  provider: ^6.1.1                  # State management đơn giản
  # riverpod: ^2.4.9                # Hoặc dùng Riverpod (uncomment nếu cần)
  
  # Networking & API
  http: ^1.1.2                      # HTTP requests
  dio: ^5.4.0                       # Advanced HTTP client
  cookie_jar: ^4.0.8                # Cookie management for Laravel sessions
  dio_cookie_manager: ^3.1.1        # Dio cookie interceptor
  
  # Local Storage
  shared_preferences: ^2.2.2        # Lưu trữ settings
  path_provider: ^2.1.1             # Truy cập file paths
  
  # File Handling
  file_picker: ^6.1.1               # Chọn files từ device
  image_picker: ^1.0.5              # Chọn hình ảnh
  open_file: ^3.3.2                 # Mở file với app mặc định
  
  # PDF
  pdf: ^3.10.7                      # Tạo PDF
  flutter_pdfview: ^1.3.2           # Xem PDF
  
  # Utilities
  intl: ^0.19.0                     # Internationalization & date format
  url_launcher: ^6.2.2              # Mở URLs, emails, phone
  fluttertoast: ^8.2.4              # Toast messages đẹp
  
  # Charts & Graphs (cho Admin reports)
  fl_chart: ^0.66.0                 # Biểu đồ đẹp
  
  # Loading & Progress
  shimmer: ^3.0.0                   # Loading skeleton
  flutter_spinkit: ^5.2.0           # Loading indicators
  
  # Form Validation
  email_validator: ^2.1.17          # Validate email
  
  # Date & Time
  table_calendar: ^3.0.9            # Calendar widget đẹp

# ============================================
# DEV DEPENDENCIES - Thư viện phát triển
# ============================================
dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Linting & Code quality
  flutter_lints: ^3.0.1
  
  # Icons generator
  flutter_launcher_icons: ^0.13.1
  
  # Native splash screen
  flutter_native_splash: ^2.3.8

# ============================================
# FLUTTER CONFIGURATION
# ============================================
flutter:
  uses-material-design: true
  
  # ==========================================
  # ASSETS - Hình ảnh, icons, files
  # ==========================================
  assets:
    # Logo & Branding
    - assets/images/huit_logo.png
    
    # Uncomment khi cần thêm assets khác
    # - assets/images/logo_white.png
    # - assets/images/splash_logo.png
    
    # Illustrations (temporarily commented out - add images later)
    # - assets/images/empty_state.png
    # - assets/images/success.png
    # - assets/images/error.png
    
    # Icons
    # - assets/icons/
    
    # Sample files (for demo) (temporarily commented out - add files later)
    # - assets/samples/sample_paper.pdf
    # - assets/samples/sample_proceedings.pdf
  
  # ==========================================
  # FONTS - Custom fonts (optional)
  # ==========================================
  # Uncomment nếu muốn dùng custom fonts
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700

# ============================================
# APP ICON CONFIGURATION
# ============================================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  
  # Adaptive icons cho Android
  adaptive_icon_background: "#7BC9A6"
  adaptive_icon_foreground: "assets/images/logo_white.png"
  
  # iOS specific
  remove_alpha_ios: true

# ============================================
# SPLASH SCREEN CONFIGURATION
# ============================================
flutter_native_splash:
  color: "#7BC9A6"
  image: assets/images/splash_logo.png
  color_dark: "#5FB491"
  image_dark: assets/images/splash_logo.png
  
  android_12:
    image: assets/images/splash_logo.png
    color: "#7BC9A6"
  
  ios: true
  android: true
  web: false